name: TDR Run Lambda Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions: {}
jobs:
  test:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@51a06bbc08eb65018238b144d0ad8bfd707a8ffa # v0.0.50
    with:
      repo-name: tdr-draft-metadata-validator
      test-command: |
        sbt "scalafmtCheckAll; test"
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
