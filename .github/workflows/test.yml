name: TDR Run Lambda Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions: {}
jobs:
  test:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@f4d7086babd2c5156dd483d445e4500a603d8dc4 # v0.0.42
    with:
      repo-name: tdr-draft-metadata-validator
      test-command: |
        sbt "scalafmtCheckAll; test"
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
